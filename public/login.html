<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>登录 · 简历优化工作台</title>
<style>
  /* 这一页必须能独立打开:样式与脚本都内联,不依赖任何需要登录才能拿到的资源 */
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --hairline: rgba(0, 0, 0, 0.08);
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --danger: #d70015;
    --ok: #1d8a5d;
    --r-lg: 18px;
    --r-md: 12px;
    --r-sm: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
  }
  .card {
    width: 100%;
    max-width: 396px;
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: var(--r-lg);
    padding: 34px 32px 30px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04), 0 24px 60px -24px rgba(0, 0, 0, 0.22);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }
  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: linear-gradient(160deg, #4aa8ff, #0071e3 62%, #0057b8);
    box-shadow: 0 4px 12px -4px rgba(0, 113, 227, 0.6);
    flex: none;
  }
  .brand-text { font-weight: 600; letter-spacing: -0.01em; }
  h1 {
    font-size: 25px;
    line-height: 1.2;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
    font-weight: 640;
  }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 22px; }
  .sub b { color: var(--text); font-weight: 600; }

  .field { margin-bottom: 14px; }
  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.01em;
  }
  .row { position: relative; }
  input[type="text"], input[type="password"] {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    font-size: 16px; /* 16px 是 iOS 聚焦时不自动放大的临界值 */
    font-family: inherit;
    color: var(--text);
    background: #fafafc;
    border: 1px solid var(--hairline);
    border-radius: var(--r-sm);
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input::placeholder { color: #a1a1a6; }
  input:focus {
    background: #fff;
    border-color: rgba(0, 113, 227, 0.5);
    box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.12);
  }
  input[aria-invalid="true"] {
    border-color: rgba(215, 0, 21, 0.5);
    box-shadow: 0 0 0 4px rgba(215, 0, 21, 0.09);
  }
  input[type="text"], input[type="password"] { padding-right: 14px; }
  .row.has-eye input { padding-right: 62px; }
  .eye {
    position: absolute;
    right: 6px;
    top: 6px;
    height: 32px;
    padding: 0 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }
  .eye:hover { background: rgba(0, 0, 0, 0.05); color: var(--text); }

  .check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0 18px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }

  .submit {
    width: 100%;
    height: 46px;
    border: 0;
    border-radius: var(--r-sm);
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, transform .06s;
  }
  .submit:hover { background: var(--accent-hover); }
  .submit:active { transform: scale(0.995); }
  .submit[disabled] { opacity: .6; cursor: default; }

  .msg {
    display: none;
    margin: 0 0 14px;
    padding: 10px 12px;
    border-radius: var(--r-sm);
    font-size: 13px;
    line-height: 1.5;
  }
  .msg.show { display: block; }
  .msg.err { background: rgba(215, 0, 21, 0.07); color: var(--danger); }
  .msg.ok { background: rgba(29, 138, 93, 0.08); color: var(--ok); }

  .foot {
    margin-top: 18px;
    font-size: 12px;
    color: #86868b;
    text-align: center;
    line-height: 1.7;
  }
  .foot code { font-size: 11.5px; background: rgba(0, 0, 0, 0.05); padding: 1px 5px; border-radius: 4px; }

  @media (max-width: 420px) {
    body { padding: 18px 12px calc(18px + env(safe-area-inset-bottom)); align-items: flex-start; }
    .card { padding: 26px 20px 24px; margin-top: 6vh; }
    h1 { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text">简历优化工作台</span>
  </div>

  <h1 id="title">登录</h1>
  <p class="sub" id="sub">这份工作台保存在本机,登录后才能使用。</p>

  <div class="msg" id="msg" role="alert" aria-live="polite"></div>

  <form id="form" autocomplete="on" novalidate>
    <div class="field">
      <label for="username">用户名</label>
      <div class="row">
        <input id="username" name="username" type="text" autocomplete="username"
               spellcheck="false" autocapitalize="off" placeholder="比如 zhangwei" required>
      </div>
    </div>

    <div class="field">
      <label for="password">密码</label>
      <div class="row has-eye">
        <input id="password" name="password" type="password"
               autocomplete="current-password" placeholder="至少 8 位" required>
        <button class="eye" type="button" id="eye" aria-label="显示密码">显示</button>
      </div>
    </div>

    <div class="field" id="confirm-field" hidden>
      <label for="confirm">确认密码</label>
      <div class="row">
        <input id="confirm" name="confirm" type="password" autocomplete="new-password"
               placeholder="再输一次" required>
      </div>
    </div>

    <label class="check" id="remember-row">
      <input type="checkbox" id="remember"> 在这台设备上保持登录 30 天
    </label>

    <button class="submit" id="submit" type="submit">登录</button>
  </form>

  <p class="foot" id="foot">
    忘记密码?删除 <code>data/auth.json</code> 后重启服务,可以重新初始化。
  </p>
</main>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var form = $('form');
  var msg = $('msg');
  var submit = $('submit');
  var state = { mode: 'login', user: '' };

  // 被拦下来的页面记在 ?next= 里,登录后回到原地
  var NEXT = (function () {
    try {
      var n = new URLSearchParams(location.search).get('next') || '';
      if (n.charAt(0) === '/' && n.charAt(1) !== '/' && n.indexOf('/login.html') !== 0) return n;
    } catch (e) {}
    return '/';
  })();

  function setMsg(text, kind) {
    if (!text) { msg.className = 'msg'; msg.textContent = ''; return; }
    msg.className = 'msg show ' + (kind || 'err');
    msg.textContent = text;
  }

  function setBusy(busy, label) {
    submit.disabled = !!busy;
    submit.textContent = busy ? (label || '处理中…') : (state.mode === 'setup' ? '创建并进入' : '登录');
  }

  function fail(id, text) {
    var el = $(id);
    if (el) el.setAttribute('aria-invalid', 'true');
    setMsg(text, 'err');
    var node = $(id === 'confirm' ? 'confirm' : (id === 'username' ? 'username' : 'password'));
    if (node) { try { node.focus(); } catch (e) {} }
    return false;
  }

  function clearInvalid() {
    ['username', 'password', 'confirm'].forEach(function (id) {
      var el = $(id);
      if (el) el.removeAttribute('aria-invalid');
    });
  }

  async function post(path, body) {
    var res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
      credentials: 'same-origin'
    });
    var data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok || data.ok === false) {
      var err = new Error(data.error || ('请求失败(' + res.status + ')'));
      err.status = res.status;
      err.code = data.code;
      throw err;
    }
    return data;
  }

  // 已经登录过就直接进工作台
  async function bootstrap() {
    var info = {};
    try {
      var res = await fetch('/api/auth/status', { credentials: 'same-origin' });
      info = await res.json();
    } catch (e) {
      setMsg('连不上本地服务,请确认 node server.js 还在运行。', 'err');
      setBusy(true);
      return;
    }
    if (info.authed && !info.needsSetup) { location.replace(NEXT); return; }
    if (info.needsSetup) {
      state.mode = 'setup';
      $('title').textContent = '设置账号';
      $('sub').innerHTML = '第一次使用,先给这台机器上的工作台设一个<b>账号和密码</b>。'
        + '账号只存在本机 <code>data/auth.json</code>,之后每次打开都要用它登录。';
      $('confirm-field').hidden = false;
      $('remember-row').hidden = true;
      $('password').setAttribute('autocomplete', 'new-password');
      $('password').placeholder = '至少 8 位,别和用户名一样';
      $('foot').innerHTML = '密码只保存加盐哈希,忘了只能删掉 <code>data/auth.json</code> 重新初始化。';
      submit.textContent = '创建并进入';
      $('username').focus();
    } else {
      state.user = info.user || '';
      $('username').value = state.user || '';
      if (state.user) $('password').focus();
      else $('username').focus();
    }
  }

  $('eye').addEventListener('click', function () {
    var input = $('password');
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    this.textContent = show ? '隐藏' : '显示';
    this.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
    input.focus();
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearInvalid();
    setMsg('');

    var username = $('username').value.trim();
    var password = $('password').value;
    var remember = $('remember').checked;

    if (!username) return fail('username', '请填用户名。');
    if (!password) return fail('password', '请填密码。');
    if (state.mode === 'setup') {
      if (password.length < 8) return fail('password', '密码至少 8 位。');
      if (password === username) return fail('password', '密码不能和用户名一样。');
      if ($('confirm').value !== password) return fail('confirm', '两次输入的密码不一致。');
    }

    setBusy(true);
    try {
      var data = await post(state.mode === 'setup' ? '/api/auth/setup' : '/api/auth/login',
        { username: username, pass: password, remember: remember });
      setMsg(state.mode === 'setup' ? '账号已创建,正在进入…' : '登录成功,正在进入…', 'ok');
      location.replace(NEXT);
      return data;
    } catch (err) {
      setBusy(false);
      if (err.code === 'locked') setMsg(err.message, 'err');
      else if (err.code === 'unauthenticated') setMsg('登录已过期,请重新登录。', 'err');
      else setMsg(err.message || '登录失败,请重试。', 'err');
      $('password').select();
      return null;
    }
  });

  bootstrap();
})();
</script>
</body>
</html>
